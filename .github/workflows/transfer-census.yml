name: Independent fresh JURY transfer census
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transfer-census.yml'
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count all provider-indexed transfers from zero, without reading project data
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: |
          PYTHONPATH=scripts python3 -u - <<'PY'
          import time,json,os
          from collections import Counter
          from datetime import datetime,timezone
          from functools import partial
          from provider import request,MASTER,address
          from indexer import hash_id,integer,digest
          from pathlib import Path

          cutoff=int(time.time())-180
          fetch=partial(request,deadline=time.monotonic()+480)
          params={'jetton_master':MASTER,'start_utime':0,'end_utime':cutoff}
          def page(order,offset,limit):
              rows=fetch('jetton/transfers',{**params,'sort':order,'offset':offset,'limit':limit})['jetton_transfers']
              if not isinstance(rows,list) or len(rows)>limit:raise ValueError('invalid response size')
              return rows
          # Fast external count by locating the first empty offset.
          lo=0;hi=32768
          while page('asc',hi,1):
              lo=hi+1;hi*=2
              if hi>4194304:raise ValueError('census bound exceeded')
          while lo<hi:
              mid=(lo+hi)//2
              if page('asc',mid,1):lo=mid+1
              else:hi=mid
          n=lo
          if n and not page('asc',n-1,1):raise ValueError('invalid boundary')
          if page('desc',n,1) or (n and not page('desc',n-1,1)):raise ValueError('opposite-order count mismatch')
          preliminary={'cutoff':cutoff,'cutoff_utc':datetime.fromtimestamp(cutoff,timezone.utc).isoformat(),'indexed_transfer_rows':n,'scope':'Toncenter index boundary count, not raw chain completeness'}
          print('EXTERNAL COUNT:',json.dumps(preliminary),flush=True)
          Path('census-boundary.json').write_text(json.dumps(preliminary,indent=2))
          def sweep(order):
              rows={}
              for offset in range(0,n,1000):
                  batch=page(order,offset,1000)
                  if len(batch)!=min(1000,n-offset):raise ValueError('page size changed')
                  for r in batch:
                      tx=hash_id(r['transaction_hash'])
                      if tx in rows:raise ValueError('duplicate transaction in census')
                      if address(r['jetton_master'])!=address(MASTER) or not 0<integer(r['transaction_now'])<=cutoff or type(r['transaction_aborted']) is not bool:raise ValueError('invalid record')
                      rows[tx]={'tx':tx,'lt':str(integer(r['transaction_lt'])),'time':integer(r['transaction_now']),'trace':hash_id(r['trace_id']),'amount_raw':str(integer(r['amount'])),'aborted':r['transaction_aborted'],'source':address(r['source']),'destination':address(r['destination'])}
                  print(order, len(rows),'/',n,flush=True)
              if page(order,n,1):raise ValueError('count changed')
              return rows
          a=sweep('asc');b=sweep('desc')
          if a!=b:raise ValueError('two full external reads disagree')
          rows=sorted(a.values(),key=lambda x:(x['time'],int(x['lt']),x['tx']))
          report={**preliminary,'distinct_transaction_hashes':len(a),'non_aborted_transfer_transactions':sum(not x['aborted'] for x in rows),'aborted_transfer_transactions':sum(x['aborted'] for x in rows),'distinct_traces':len({x['trace'] for x in rows}),'first':rows[0] if rows else None,'last':rows[-1] if rows else None,'rows_digest':digest(rows),'two_full_reads_match':True,'scope':'Full Toncenter indexed jetton/transfer requests at timestamp cutoff, two orderings. Not proof of all successful deliveries, mints, burns or blockchain completeness.'}
          Path('census.json').write_text(json.dumps(report,indent=2))
          Path('census-rows.json').write_text(json.dumps(rows,separators=(',',':')))
          print('FINAL EXTERNAL CENSUS:',json.dumps(report),flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Fresh external JURY count\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-transfer-census
          path: census*.json
          if-no-files-found: warn
