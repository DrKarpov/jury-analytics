name: Investigate trade discrepancies (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discrepancy.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: history
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_discrepancy.py -v
      - name: Inspect representative disagreement traces
        env:
          TONCENTER_API_KEY: ''
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          git -C history rev-parse HEAD
          python3 -u scripts/discrepancy.py --store history --out data/discrepancy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jury-discrepancy-evidence
          path: data/discrepancy/
          if-no-files-found: error
          retention-days: 14
