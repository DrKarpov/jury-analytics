name: Replay real post-anchor account continuation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/continuation_shadow.py'
      - 'tests/test_continuation_shadow.py'
      - '.github/workflows/continuation-shadow.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate continuation and original chain traversal
        run: |
          python3 -m unittest discover -s source/tests -p test_continuation_shadow.py -v
          python3 -m unittest discover -s source/tests -p test_wallet_history.py -v
      - name: Capture and replay post-anchor account evidence
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          mkdir -p report
          git -C store rev-parse HEAD > report/data-ref.txt
          git -C source rev-parse HEAD > report/source-ref.txt
          python3 -u source/scripts/continuation_shadow.py --store store --out report/continuation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-anchor-continuation-shadow
          path: report/
