name: Inspect Moon.cx contract and referral evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moon-attribution.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: history
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p test_moon_attribution.py -v
      - name: Check observed JURY counterparties and decoded referral hints
        env:
          TONCENTER_API_KEY: ''
        run: python3 -u scripts/moon_attribution.py --store history --out data/moon-attribution
      - uses: actions/upload-artifact@v4
        with:
          name: moon-attribution
          path: data/moon-attribution/
          if-no-files-found: error
