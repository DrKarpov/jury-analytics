name: Reconcile verified Omniston final payouts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/payout-repair.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: jury-persistent-data
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: jury-discrepancy-evidence
          run-id: 46022908349
          github-token: ${{ github.token }}
          path: fixtures
      - name: Reproduce known cases against raw traces
        env:
          JURY_DISCREPANCY_FIXTURES: fixtures
        run: python3 -m unittest discover -s source/tests -v
      - name: Verify and store final payouts
        env:
          TONCENTER_API_KEY: ''
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          python3 source/scripts/payout_repair.py --store store
          python3 source/scripts/auto_repair.py --store store --limit 1 --seconds 20
          python3 source/scripts/persistent_preview.py --store store --out preview
      - name: Persist independently verified records
        run: |
          git -C store config user.name 'github-actions[bot]'
          git -C store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C store add -A
          if ! git -C store diff --cached --quiet; then
            git -C store commit -m 'Checkpoint verified Omniston sale payout corrections'
            git -C store push origin HEAD:data
          fi
