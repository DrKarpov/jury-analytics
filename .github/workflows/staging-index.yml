name: Staging index (manual, no publish)
on:
  workflow_dispatch:
    inputs:
      use_api_key:
        description: 'Use configured Toncenter API key (optional)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-index.yml'
      - 'scripts/indexer.py'
      - 'scripts/provider.py'
permissions:
  contents: read
concurrency:
  group: jury-staging
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/staging.py --full
        env:
          TONCENTER_API_KEY: ${{ inputs.use_api_key && secrets.TONCENTER_API_KEY || '' }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
      - name: Build unpublished preview
        if: always()
        run: |
          if [ -f data/staging/candidate.json ] && [ -f data/staging/swap-audit.json ] && [ -f data/staging/holders.json ]; then
            python3 scripts/preview.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-snapshot
          path: |
            data/staging/*.json
            data/preview/
