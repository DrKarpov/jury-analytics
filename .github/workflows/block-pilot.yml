name: Pilot independent masterchain block enumeration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/block_pilot.py'
      - 'tests/test_block_pilot.py'
      - '.github/workflows/block-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded block enumeration
        run: python3 -m unittest discover -s source/tests -p test_block_pilot.py -v
      - name: Compare independent provider block censuses
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          mkdir -p block-report
          git -C store rev-parse HEAD > block-report/data-ref.txt
          git -C source rev-parse HEAD > block-report/source-ref.txt
          python3 -u source/scripts/block_pilot.py --store store --out block-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-block-pilot
          path: block-report/
