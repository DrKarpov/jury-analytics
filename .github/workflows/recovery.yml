name: Update and audit persistent history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/continuation_store.py'
      - 'scripts/counterpart_discovery.py'
      - 'scripts/peer_prefix.py'
      - 'scripts/master_continuation.py'
      - 'tests/test_master_continuation.py'
      - 'tests/test_peer_prefix.py'
      - 'tests/test_counterpart_discovery.py'
      - 'tests/test_continuation_store.py'
      - '.github/workflows/recovery.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: jury-persistent-data
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for saved seed
        id: seed
        run: |
          if test -f store/seed/manifest.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.seed.outputs.needed == 'true'
        with:
          name: staging-snapshot
          path: seed-input
          run-id: 46001289693
          github-token: ${{ github.token }}
      - name: Recover and commit immutable history
        if: steps.seed.outputs.needed == 'true'
        run: |
          python3 source/scripts/recovery.py seed --input seed-input/staging --store store
          bash source/scripts/checkpoint.sh store 'Recover primary JURY history from staging artifact' ':(glob)seed/**/*.json'
      - name: Collect validated incremental segments
        timeout-minutes: 6
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: |
          python3 -u source/scripts/incremental.py --store store --max-windows 3
          bash source/scripts/checkpoint.sh store 'Checkpoint incremental primary history' ':(glob)updates/batch-*.json' update-status.json
      - name: Refresh and persist independent holder observation
        timeout-minutes: 2
        continue-on-error: true
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          python3 -u source/scripts/holder_state.py --store store
          bash source/scripts/checkpoint.sh store 'Checkpoint independent holder observation' holders/latest.json holders/status.json ':(glob)holders/daily/*.json'
      - name: Persist verified post-anchor continuation shadow
        timeout-minutes: 3
        continue-on-error: true
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          python3 -m unittest discover -s source/tests -p test_continuation_store.py -v
          python3 -u source/scripts/continuation_store.py --store store --limit 12 --seconds 90
          bash source/scripts/checkpoint.sh store 'Checkpoint post-anchor continuation shadow' continuation/v1
      - name: Discover exact opposite message endpoints
        timeout-minutes: 3
        continue-on-error: true
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          python3 -m unittest discover -s source/tests -p test_counterpart_discovery.py -v
          python3 -u source/scripts/counterpart_discovery.py --store store --limit 20 --seconds 80
          bash source/scripts/checkpoint.sh store 'Checkpoint post-anchor counterpart discovery' continuation/v1/counterparts continuation/v1/counterpart-status.json continuation/v1/counterpart-pending.json
      - name: Reconstruct counterpart-pinned peer prefixes
        timeout-minutes: 3
        continue-on-error: true
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          python3 -m unittest discover -s source/tests -p test_peer_prefix.py -v
          python3 -u source/scripts/peer_prefix.py --store store --limit 8 --seconds 55
          bash source/scripts/checkpoint.sh store 'Checkpoint counterpart-pinned peer prefixes' continuation/v1/peer-prefixes continuation/v1/peer-status.json continuation/v1/peer-pending.json
      - name: Extend independently observed master account
        timeout-minutes: 2
        continue-on-error: true
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          python3 -m unittest discover -s source/tests -p test_master_continuation.py -v
          python3 -u source/scripts/master_continuation.py --store store --seconds 55
          bash source/scripts/checkpoint.sh store 'Checkpoint post-anchor master account' continuation/v1/master
