name: Update and audit persistent history
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: jury-persistent-data
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for saved seed
        id: seed
        run: |
          if test -f store/seed/manifest.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.seed.outputs.needed == 'true'
        with:
          name: staging-snapshot
          path: seed-input
          run-id: 46001289693
          github-token: ${{ github.token }}
      - name: Recover and commit immutable history
        if: steps.seed.outputs.needed == 'true'
        run: |
          python3 source/scripts/recovery.py seed --input seed-input/staging --store store
          bash source/scripts/checkpoint.sh store 'Recover primary JURY history from staging artifact' ':(glob)seed/**/*.json'
      - name: Collect validated incremental segments
        timeout-minutes: 6
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: |
          python3 -u source/scripts/incremental.py --store store --max-windows 3
          bash source/scripts/checkpoint.sh store 'Checkpoint incremental primary history' ':(glob)updates/batch-*.json' update-status.json
      - name: Refresh and persist independent holder observation
        timeout-minutes: 2
        continue-on-error: true
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: |
          python3 -u source/scripts/holder_state.py --store store
          bash source/scripts/checkpoint.sh store 'Checkpoint independent holder observation' holders/latest.json holders/status.json ':(glob)holders/daily/*.json'
