name: Publish provisional JURY dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Update and audit persistent history', 'Audit current JURY trace revisions', 'Reconstruct JURY genesis and delivery receipts', 'Verify missing arbitrage legs across history']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/**'
      - '!scripts/genesis_checkpoint.py'
      - '!scripts/master_history.py'
      - '!scripts/wallet_history.py'
      - '!scripts/wallet_reconcile.py'
      - 'docs/**'
permissions:
  contents: read
concurrency:
  group: jury-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.build.outputs.source }}
      data: ${{ steps.build.outputs.data }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: history
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build public beta
        id: build
        run: |
          source=$(git rev-parse HEAD)
          data=$(git -C history rev-parse HEAD)
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s tests -v
          node tests/analytics.test.mjs
          node tests/wallets.test.mjs
          node tests/integrity.test.mjs
          node tests/cost-basis.test.mjs
          python3 scripts/public_beta.py --store history --out site --source-sha "$source" --data-sha "$data"
          node tests/check_public_beta.mjs site
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/persistent_browser_test.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether validated artifact is still current
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source }}
          DATA_SHA: ${{ needs.build.outputs.data }}
        run: |
          set -euo pipefail
          source_now=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          data_now=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/data" --jq .object.sha)
          if [[ "$source_now" != "$SOURCE_SHA" || "$data_now" != "$DATA_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Validated artifact superseded by a newer source or data checkpoint; deployment intentionally skipped."
            echo "### Deployment skipped: newer checkpoint available" >> "$GITHUB_STEP_SUMMARY"
            echo "No artifact was published. A subsequent source push or completed data workflow triggers a fresh build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.current == 'true'
      - name: Deploy validated public beta
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
