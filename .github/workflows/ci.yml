name: Code tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/analytics.test.mjs && node tests/wallets.test.mjs && node tests/integrity.test.mjs && node tests/cost-basis.test.mjs && for f in docs/*.mjs; do node --check "$f"; done

      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_test.py
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: data
          path: history
          persist-credentials: false
      - name: Validate beta candidate against saved history
        if: github.event_name == 'pull_request'
        run: |
          JURY_HISTORY_FIXTURES=history python3 -m unittest discover -s tests -p 'test_delivery_repair.py' -v
          python3 scripts/public_beta.py --store history --out site --source-sha "$(git rev-parse HEAD)" --data-sha "$(git -C history rev-parse HEAD)"
          node tests/check_public_beta.mjs site
          python3 tests/persistent_browser_test.py site
