name: Provider diagnostics (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-diagnostics.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare public and authenticated endpoints
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, time, os, json, base64
          master = 'Ef-_fgHqEczCswLpnBEoIvgyruJUvn_QDt5QRjecY8w3lr2i'
          decoded = base64.urlsafe_b64decode(master)
          raw = str(int.from_bytes(decoded[1:2], 'big', signed=True)) + ':' + decoded[2:34].hex()
          key = os.environ.get('TONCENTER_API_KEY', '')
          def probe(label, url, auth=False):
              headers = {'Accept':'application/json', 'User-Agent':'JURY-Analytics/1.0'}
              if auth and key: headers['X-API-Key'] = key
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as r:
                      obj = json.load(r)
                      print(label, 'HTTP', r.status, 'JSON fields:', sorted(obj) if isinstance(obj,dict) else type(obj).__name__, flush=True)
              except urllib.error.HTTPError as e:
                  print(label, 'HTTP', e.code, 'type:', e.headers.get('Content-Type'), 'server:', e.headers.get('Server'), flush=True)
                  if 'json' in (e.headers.get('Content-Type') or '').lower():
                      try:
                          body = json.loads(e.read(4096))
                          if isinstance(body,dict):
                              msg = str(body.get('error') or body.get('message') or body.get('detail') or '')[:300]
                              print('API message:', msg.replace(key, '[redacted]') if key else msg, flush=True)
                      except (ValueError, UnicodeError): pass
              except Exception as e:
                  print(label, type(e).__name__, flush=True)
              time.sleep(2)
          tc = 'https://toncenter.com/api/v3/'
          print('API key configured:', bool(key), flush=True)
          for auth in (False, True):
              suffix = 'authenticated' if auth else 'anonymous'
              probe('transactions '+suffix, tc+'transactions?limit=1', auth)
              probe('jetton transfers '+suffix, tc+'jetton/transfers?'+urllib.parse.urlencode({'jetton_master':master,'limit':1,'sort':'desc'}), auth)
          probe('jetton transfers small page raw address', tc+'jetton/transfers?'+urllib.parse.urlencode({'jetton_master':raw,'limit':1,'sort':'desc'}), True)
          probe('TonAPI jetton metadata', 'https://tonapi.io/v2/jettons/'+master)
          PY
