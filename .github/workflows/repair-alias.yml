name: Recalculate legacy DeDust alias (unpublished)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-alias.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: history
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Recalculate known disagreement traces
        env:
          TONCENTER_API_KEY: ''
          TONAPI_API_KEY: ${{ secrets.TONAPI_API_KEY }}
        run: python3 -u scripts/repair_alias.py --store history --out data/repair-alias
      - uses: actions/upload-artifact@v4
        with:
          name: jury-alias-repair-proposals
          path: data/repair-alias/
          if-no-files-found: error
          retention-days: 14
