<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>JURY Analytics</title>
<link rel="icon" href="telegram.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="overview">
<header>
<div class="brand">
<img src="telegram.svg" alt="" width="36" height="36">
<h1>JURY Analytics</h1>
</div>
<div class="head-actions">
<span id="status" class="status" role="status">—</span>
<button id="language" aria-label="Language">EN</button>
</div>
</header>
<nav class="section-nav" aria-label="Разделы">
<a id="nav-overview" href="#overview">Обзор</a>
<a id="nav-operations" href="#operations">Операции</a>
<a id="nav-wallets" href="#wallet-analysis">Кошельки</a>
<a id="nav-holders" href="#holders">Держатели</a>
</nav>
<div class="overview-toolbar">
<div>
<h2 id="overview-title">Обзор рынка</h2>
<p id="data-cutoff" class="muted" role="status">
</p>
</div>
<nav id="periods" aria-label="Period">
<button data-period="6h">6H</button>
<button data-period="24h">24H</button>
<button data-period="7d">7D</button>
<button data-period="30d">30D</button>
<button data-period="all" id="available-history" aria-pressed="true">Доступная история</button>
<button data-period="custom" id="custom-label">Период</button>
</nav>
</div>
<div id="custom" hidden>
<label>
<span id="from-label">С</span>
<input id="from" type="date">
</label>
<label>
<span id="to-label">По</span>
<input id="to" type="date">
</label>
</div>
<div class="market-grid">
<section id="metrics" class="metrics">
</section>
<section class="card chart-card">
<div class="section-head">
<h2 id="chart-title">Торговая активность</h2>
<span id="chart-period" class="muted">
</span>
</div>
<div id="chart" class="chart">
</div>
<p id="chart-reading" class="chart-reading muted" aria-live="polite">
</p>
<div class="legend">
<span class="buy" id="buy-legend">Покупки</span>
<span class="sell" id="sell-legend">Продажи</span>
</div>
</section>
</div>
<p id="notice" class="notice" role="status">
</p>
<details id="data-quality">
<summary>
<span id="quality-title">Состояние данных</span>
<span id="staging-badge" class="staging" hidden></span>
<span id="quality-unresolved" class="muted"></span>
</summary>
<p id="audit-line" class="muted" hidden>
</p>
</details>
<section class="card" id="operations">
<div class="section-head">
<h2 id="tx-title">Операции</h2>
<button id="export" disabled>CSV</button>
</div>
<div class="operation-tools">
<div class="filters" id="filters">
</div>
<input id="operation-query" type="search" autocomplete="off" spellcheck="false" placeholder="Адрес или хеш трассы" aria-label="Поиск по адресу или хешу трассы">
</div>
<p id="operation-count" class="muted" role="status">
</p>
<div id="transactions">
</div>
<button id="more" hidden>
</button>
</section>
<section class="card">
<div class="section-head">
<h2 id="wallet-title">Торговые кошельки</h2>
<span class="muted" id="wallet-sub">
</span>
</div>
<div id="wallets">
</div>
</section>
<section id="holders" class="card">
<div class="section-head">
<h2 id="holders-title">Держатели</h2>
<span id="holder-date" class="muted">
</span>
</div>
<p id="holder-note" class="muted note">
</p>
<div id="holder-metrics" class="mini-grid">
</div>
<div id="holder-table">
</div>
</section>
<section class="card">
<h2 id="acc-title">Чистые покупки / продажи</h2>
<p id="acc-note" class="muted note">
</p>
<div id="acc-table">
</div>
</section>
<section id="wallet-analysis" class="card">
<h2 id="search-title">Аналитика адреса</h2>
<p id="wallet-note" class="muted note">
</p>
<div class="wallet-search">
<input id="wallet-input" type="text" autocomplete="off" spellcheck="false">
<button id="search-button">Найти</button>
</div>
<div id="wallet-detail" class="mini-grid" aria-live="polite">
</div>
<div id="pnl-panel" hidden>
<h3 id="pnl-title">
</h3>
<p id="pnl-note" class="muted note">
</p>
<div id="pnl-metrics" class="mini-grid">
</div>
</div>
</section>
<section class="card">
<h2 id="edges-title">Связи адресов</h2>
<p id="edges-note" class="muted note">
</p>
<div id="edges-table">
</div>
</section>
<section class="card">
<h2 id="lifecycle-title">Ликвидность и эмиссия</h2>
<p id="lifecycle-note" class="muted note">
</p>
<div id="lifecycle-metrics" class="mini-grid">
</div>
</section>
<footer>
<span id="footer-text">Независимый дашборд JURY.</span> <a id="contract" href="https://tonviewer.com/Ef-_fgHqEczCswLpnBEoIvgyruJUvn_QDt5QRjecY8w3lr2i">Контракт</a>
</footer>
</main>
<script type="module" src="app.mjs">
</script>
</body>
</html>
